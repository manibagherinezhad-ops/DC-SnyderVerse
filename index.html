<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DC: SnyderVerse</title>
    <style>
        *,
        *::before,
        *::after {
            padding: 0;
            margin: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background:
                radial-gradient(ellipse at 15% 20%,
                    rgba(24, 57, 94, 0.5),
                    transparent 50%),
                radial-gradient(ellipse at 85% 80%,
                    rgba(112, 22, 35, 0.35),
                    transparent 45%),
                #08090D;
        }

        .panjareh {

            width: 800px;
            height: 500px;
            /* border: 1px solid red; */
            margin: 150px auto;
            position: relative;
            overflow: hidden;
            border-radius: 10px;

            >figure {
                position: absolute;
                width: 100%;
                height: 100%;
                /* left: -100%; */
                top: 0;
                animation: 20s ease-in-out infinite;
                &::after{
                    content: '';
                    position: absolute;
                    width: 100%;
                    height: 100px;
                    left: 0;
                    bottom: 0;
                    /* border: 1px solid red; */
                    background: linear-gradient(to top, black, transparent);
                }

                &:nth-of-type(1) {
                    animation-name: aks1;
                    >figcaption{
                        background-image: url(img1/Superman.jpg);
                        background-position: 50% 60%;
                        background-clip: text;
                        color: transparent;
                    }
                }

                &:nth-of-type(2) {
                    animation-name: aks2;
                    >figcaption{
                        background-image: url(img1/Batman.jpg);
                        background-position: 50% 40%;
                        background-clip: text;
                        color: transparent;
                    }
                }

                &:nth-of-type(3) {
                    animation-name: aks3;
                    >figcaption{
                        background-image: url(img1/The Flash.jpg);
                        background-position: 10% 60%;
                        background-clip: text;
                        color: transparent;
                    }
                }

                &:nth-of-type(4) {
                    animation-name: aks4;
                    >figcaption{
                        background-image: url(img1/Darkseid.jpg);
                        background-position: 0% 60%;
                        background-clip: text;
                        color: transparent;
                    }
                }

                >img {
                    width: 100%;
                    height: 100%;
                    /* border: 1px solid yellow; */
                    object-fit: cover;
                }

                >figcaption {
                    width: 100%;
                    height: 50px;
                    /* border: 1px solid white; */
                    display: flex;
                    justify-content: center;
                    align-items: center;
                    font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
                    font-size: 50px;
                    /* color: white; */
                    text-transform: uppercase;
                    position: absolute;
                    left: 0;
                    bottom: 0;
                    /* padding: 50px; */
                    margin-bottom: 70px;
                    background: linear-gradient(to top, black, transparent);
                    
                }
            }
        }

        @keyframes aks1 {
            0% {
                left: 0;
            }

            15% {
                left: 0;
            }

            25% {
                left: 100%;
            }

            25.00001% {
                left: -100%;
            }

            90% {
                left: -100%;
            }

            98% {
                left: 0;
            }

            100% {
                left: 0;
            }
        }

        @keyframes aks2 {
            0% {
                left: -100%;
            }

            15% {
                left: -100%;
            }

            25% {
                left: 0;
            }

            40% {
                left: 0;
            }

            50% {
                left: 100%;
            }

            50.00001% {
                left: -100%;
            }

            100% {
                left: -100%;
            }
        }

        @keyframes aks3 {
            0% {
                left: -100%;
            }

            40% {
                left: -100%;
            }

            50% {
                left: 0;
            }

            65% {
                left: 0;
            }

            75% {
                left: 100%;
            }

            75.00001% {
                left: -100%;
            }

            100% {
                left: -100%;
            }
        }

        @keyframes aks4 {
            0% {
                left: -100%;
            }

            65% {
                left: -100%;
            }

            75% {
                left: 0;
            }

            90% {
                left: 0;
            }

            98% {
                left: 100%;
            }

            100% {
                left: 100%;
            }

        }
    </style>
</head>

<body>
    <div class="panjareh">
        <figure>
            <img src="img1/Superman.jpg" alt="">
            <figcaption>Superman</figcaption>
        </figure>
        <figure>
            <img src="img1/Batman.jpg" alt="">
            <figcaption>Batman</figcaption>
        </figure>
        <figure>
            <img src="img1/The Flash.jpg" alt="">
            <figcaption>The Flash</figcaption>
        </figure>
        <figure>
            <img src="img1/Darkseid.jpg" alt="">
            <figcaption>Darkseid</figcaption>
        </figure>
    </div>
</body>

</html>
